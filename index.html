<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Counter App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <main class="bg-slate-800 border border-slate-700/60 shadow-2xl rounded-3xl p-8 sm:p-10 w-full max-w-sm text-center transform transition-all">
        <!-- Header -->
        <h1 class="text-slate-400 font-semibold text-sm tracking-widest uppercase mb-6">
            Simple Counter
        </h1>

        <!-- Counter Display -->
        <div class="my-8">
            <span id="counter" class="text-7xl sm:text-8xl font-extrabold tracking-tight text-white transition-all duration-200 inline-block select-none">
                0
            </span>
        </div>

        <!-- Controls -->
        <div class="flex items-center justify-center gap-4 mb-6">
            <!-- Decrement Button -->
            <button 
                id="decrement-btn"
                onclick="changeCount(-1)" 
                aria-label="Decrement count"
                class="w-16 h-16 sm:w-20 sm:h-20 bg-rose-500/10 hover:bg-rose-500/20 active:scale-95 text-rose-400 border border-rose-500/20 rounded-2xl flex items-center justify-center text-3xl font-bold transition-all focus:outline-none focus:ring-2 focus:ring-rose-500/50"
            >
                −
            </button>

            <!-- Increment Button -->
            <button 
                id="increment-btn"
                onclick="changeCount(1)" 
                aria-label="Increment count"
                class="w-16 h-16 sm:w-20 sm:h-20 bg-emerald-500/10 hover:bg-emerald-500/20 active:scale-95 text-emerald-400 border border-emerald-500/20 rounded-2xl flex items-center justify-center text-3xl font-bold transition-all focus:outline-none focus:ring-2 focus:ring-emerald-500/50"
            >
                +
            </button>
        </div>

        <!-- Reset Button -->
        <button 
            onclick="resetCount()" 
            class="text-xs font-semibold text-slate-400 hover:text-slate-200 uppercase tracking-wider transition-colors py-2 px-4 rounded-lg hover:bg-slate-700/50 focus:outline-none"
        >
            Reset
        </button>
    </main>

    <script>
        // State variable
        let count = 0;

        // DOM Elements
        const counterEl = document.getElementById('counter');

        /**
         * Modifies the current count by a specified delta
         * @param {number} amount - The amount to add or subtract
         */
        function changeCount(amount) {
            count += amount;
            updateDisplay();
            animateCounter();
        }

        /**
         * Resets the counter back to zero
         */
        function resetCount() {
            count = 0;
            updateDisplay();
            animateCounter();
        }

        /**
         * Updates the HTML text content
         */
        function updateDisplay() {
            counterEl.textContent = count;
        }

        /**
         * Adds a micro-animation effect when the count changes
         */
        function animateCounter() {
            counterEl.classList.add('scale-110');
            setTimeout(() => {
                counterEl.classList.remove('scale-110');
            }, 100);
        }

        // Keyboard navigation support (+ / - / r)
        document.addEventListener('keydown', (e) => {
            if (e.key === '+' || e.key === '=') changeCount(1);
            if (e.key === '-' || e.key === '_') changeCount(-1);
            if (e.key.toLowerCase() === 'r') resetCount();
        });
    </script>
</body>
</html>
